services:
  postgres:
    image: postgres:15
    container_name: liceu_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liceu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liceu}
      POSTGRES_DB: ${POSTGRES_DB:-liceu}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liceu} -d ${POSTGRES_DB:-liceu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: liceu_redis
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  nats:
    image: nats:latest
    container_name: liceu_nats
    command: "-js -m 8222"
    ports:
      - "4222:4222"
      - "8222:8222"

  archimedes_api:
    build:
      context: ../..
      dockerfile: liceu-6.0/archimedes/apps/api/Dockerfile
    ports:
      - "8010:8000"
    env_file:
      - ../.env
    depends_on:
      - postgres
      - nats
      - redis

  archimedes_web:
    build:
      context: ../..
      dockerfile: liceu-6.0/archimedes/apps/web/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - archimedes_api

  runtime:
    build:
      context: ../..
      dockerfile: liceu-6.0/infra/python-service.Dockerfile
      args:
        REQUIREMENTS_PATH: liceu-6.0/runtime/requirements.txt
    container_name: liceu_runtime
    working_dir: /app
    env_file:
      - ../.env
    volumes:
      - ../runtime:/app
      - ../core-sdk:/shared/core-sdk
      - ../event-registry:/event-registry:ro
    environment:
      EVENT_REGISTRY_PATH: /event-registry/events.json
      RUNTIME_EVENT_LOG_PATH: /app/data/events.jsonl
      PYTHONPATH: /shared/core-sdk
    command: python main.py
    depends_on:
      - nats
      - redis

  juridicotech:
    build:
      context: ../..
      dockerfile: liceu-6.0/infra/python-service.Dockerfile
      args:
        REQUIREMENTS_PATH: liceu-6.0/monolitos/juridicotech/requirements.txt
    container_name: liceu_juridicotech
    working_dir: /app
    env_file:
      - ../.env
    volumes:
      - ../monolitos/juridicotech:/app
      - ../core-sdk:/shared/core-sdk
    environment:
      PYTHONPATH: /shared/core-sdk
    command: python main.py
    depends_on:
      - nats

  hubbackoffice:
    build:
      context: ../..
      dockerfile: liceu-6.0/infra/python-service.Dockerfile
      args:
        REQUIREMENTS_PATH: liceu-6.0/monolitos/hubbackoffice/requirements.txt
    container_name: liceu_hubbackoffice
    working_dir: /app
    env_file:
      - ../.env
    volumes:
      - ../monolitos/hubbackoffice:/app
      - ../core-sdk:/shared/core-sdk
    environment:
      PYTHONPATH: /shared/core-sdk
    command: python main.py
    depends_on:
      - nats

  gamemkt:
    build:
      context: ../..
      dockerfile: liceu-6.0/infra/python-service.Dockerfile
      args:
        REQUIREMENTS_PATH: liceu-6.0/monolitos/gamemkt/requirements.txt
    container_name: liceu_gamemkt
    working_dir: /app
    env_file:
      - ../.env
    volumes:
      - ../monolitos/gamemkt:/app
      - ../core-sdk:/shared/core-sdk
    environment:
      PYTHONPATH: /shared/core-sdk
    command: python main.py
    depends_on:
      - nats

  john:
    build:
      context: ../..
      dockerfile: liceu-6.0/infra/python-service.Dockerfile
      args:
        REQUIREMENTS_PATH: liceu-6.0/monolitos/john/requirements.txt
    container_name: liceu_john
    working_dir: /app
    env_file:
      - ../.env
    volumes:
      - ../monolitos/john:/app
      - ../core-sdk:/shared/core-sdk
    environment:
      PYTHONPATH: /shared/core-sdk
    command: python main.py
    depends_on:
      - nats

  kong:
    image: kong:latest
    container_name: liceu_kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      - archimedes_api

  prometheus:
    image: prom/prometheus:latest
    container_name: liceu_prometheus
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:2.9.8
    container_name: liceu_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../observability/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    container_name: liceu_grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata:
  redisdata:
  grafanadata:
