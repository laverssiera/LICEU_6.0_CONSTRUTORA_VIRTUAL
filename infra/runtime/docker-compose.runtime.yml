version: "3.9"

services:

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: liceu
      POSTGRES_PASSWORD: liceu
      POSTGRES_DB: liceu_runtime
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3005:3000"

  loki:
    image: grafana/loki:2.9.8
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.5.0
    ports:
      - "3200:3200"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"

  schema-registry:
    image: apicurio/apicurio-registry-mem:2.5.10.Final
    ports:
      - "8081:8080"
