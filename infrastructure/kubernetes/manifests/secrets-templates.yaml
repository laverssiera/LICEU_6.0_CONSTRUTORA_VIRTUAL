apiVersion: v1
kind: Secret
metadata:
  name: neo4j-secret
type: Opaque
data:
  NEO4J_USER: <base64-user>
  NEO4J_PASSWORD: <base64-password>
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
type: Opaque
data:
  REDIS_PASSWORD: <base64-password>
---
apiVersion: v1
kind: Secret
metadata:
  name: nats-secret
type: Opaque
data:
  NATS_USER: <base64-user>
  NATS_PASSWORD: <base64-password>
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-secret
type: Opaque
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: <base64-endpoint>
---
apiVersion: v1
kind: Secret
metadata:
  name: federation-tokens
type: Opaque
data:
  FEDERATION_TOKEN: <base64-token>
---
apiVersion: v1
kind: Secret
metadata:
  name: sovereign-runtime-auth
type: Opaque
data:
  SOVEREIGN_AUTH_TOKEN: <base64-token>
