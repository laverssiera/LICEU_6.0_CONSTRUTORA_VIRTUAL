apiVersion: v1
kind: Service
metadata:
  name: agi-agents
spec:
  selector:
    app: agi-agents
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agi-agents
  labels:
    app: agi-agents
    tracing: enabled
    federation: enabled
  annotations:
    sovereign-runtime: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agi-agents
  template:
    metadata:
      labels:
        app: agi-agents
        tracing: enabled
        federation: enabled
      annotations:
        sovereign-runtime: "true"
    spec:
      containers:
        - name: agi-agents
          image: liceu/agi-agents:latest
          ports:
            - containerPort: 8084
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 20
      automountServiceAccountToken: true
