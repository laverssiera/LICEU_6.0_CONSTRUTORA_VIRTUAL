apiVersion: v1
kind: ConfigMap
metadata:
  name: federation-config
  labels:
    app: federation-runtime
data:
  federation.yaml: |
    federation:
      mesh: "planetary"
      trust: "zero-trust"
      discovery: "enabled"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tracing-config
  labels:
    app: prometheus
    tracing: enabled
data:
  tracing.yaml: |
    tracing:
      provider: "jaeger"
      endpoint: "http://jaeger:14268/api/traces"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cognition-config
  labels:
    app: cognition-runtime
data:
  cognition.yaml: |
    cognition:
      mode: "sovereign"
      resilience: "planetary"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-config
  labels:
    app: prometheus
    observability: enabled
data:
  observability.yaml: |
    prometheus:
      scrape_interval: 15s
      federation: "enabled"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: planetary-federation-config
  labels:
    app: planetary-federation-runtime
data:
  planetary-federation.yaml: |
    planetary:
      federation: "enabled"
      mesh: "planetary"
      trust: "sovereign"
