apiVersion: v1
kind: Service
metadata:
  name: collective-mind
spec:
  selector:
    app: collective-mind
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collective-mind
  labels:
    app: collective-mind
    tracing: enabled
    federation: enabled
  annotations:
    sovereign-runtime: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collective-mind
  template:
    metadata:
      labels:
        app: collective-mind
        tracing: enabled
        federation: enabled
      annotations:
        sovereign-runtime: "true"
    spec:
      containers:
        - name: collective-mind
          image: liceu/collective-mind:latest
          ports:
            - containerPort: 8081
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 20
      automountServiceAccountToken: true
