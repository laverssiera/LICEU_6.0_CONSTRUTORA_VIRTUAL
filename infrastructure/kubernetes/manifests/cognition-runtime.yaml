apiVersion: v1
kind: Service
metadata:
  name: cognition-runtime
spec:
  selector:
    app: cognition-runtime
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognition-runtime
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cognition-runtime
  template:
    metadata:
      labels:
        app: cognition-runtime
    spec:
      containers:
        - name: cognition-runtime
          image: liceu/cognition-runtime:latest
          ports:
            - containerPort: 8090
