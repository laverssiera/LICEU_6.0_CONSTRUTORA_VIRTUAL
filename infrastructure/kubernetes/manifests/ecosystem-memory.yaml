apiVersion: v1
kind: Service
metadata:
  name: ecosystem-memory
spec:
  selector:
    app: ecosystem-memory
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecosystem-memory
  labels:
    app: ecosystem-memory
    tracing: enabled
    federation: enabled
  annotations:
    sovereign-runtime: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecosystem-memory
  template:
    metadata:
      labels:
        app: ecosystem-memory
        tracing: enabled
        federation: enabled
      annotations:
        sovereign-runtime: "true"
    spec:
      containers:
        - name: ecosystem-memory
          image: liceu/ecosystem-memory:latest
          ports:
            - containerPort: 8082
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 20
      automountServiceAccountToken: true
